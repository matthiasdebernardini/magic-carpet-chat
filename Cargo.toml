[package]
name = "magic-carpet-chat"
version = "0.1.0"
edition = "2024"
publish = false

# gpui-component itself declares `gpui = { git = ".../zed" }` with no rev, so the
# zed deps here must also stay rev-less: a rev on one side and not the other makes
# cargo build two copies of gpui and every type stops matching.
# The exact revisions are pinned by Cargo.lock — see README.md.
[dependencies]
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = [
    "font-kit",
] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "6d07863fe7077f85abfa0ec2fcb05f3e17c573b2" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "6d07863fe7077f85abfa0ec2fcb05f3e17c573b2" }

# gpui already speaks `http_client`; reqwest_client is the implementation zed
# installs into it. Same rev-less rule as the gpui deps above.
http_client = { git = "https://github.com/zed-industries/zed" }
reqwest_client = { git = "https://github.com/zed-industries/zed" }
futures = "0.3"
serde_json = "1"

# Debug builds of gpui and its text/layout stack are unusably slow without this.
# Copied from the gpui-component workspace.
[profile.dev]
codegen-units = 16
split-debuginfo = "unpacked"

[profile.dev.package]
gpui = { opt-level = 3 }
gpui_platform = { opt-level = 3 }
gpui_macros = { opt-level = 3 }
resvg = { opt-level = 3 }
ropey = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
smol = { opt-level = 3 }
sum_tree = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
