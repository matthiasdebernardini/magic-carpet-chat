<meta charset="utf-8">
<title>Magic Carpet Chat Atlas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
:root{
  --paper:#E6DFBE; --paper-2:#DCD4AF; --ink:#17170F; --ink-2:#6E6B54; --rule:#B9B293; --ghost:#8E8A70;
  --hi-bg:#17170F; --hi-fg:#E6DFBE; --face:#EFE9CC; --grid:#CFC8A3;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1E1D15; --paper-2:#26251B; --ink:#E6DFBE; --ink-2:#A8A388; --rule:#4A4838; --ghost:#6E6B54;
    --hi-bg:#E6DFBE; --hi-fg:#1E1D15; --face:#2A2920; --grid:#33321F;
  }
}
:root[data-theme="dark"]{
  --paper:#1E1D15; --paper-2:#26251B; --ink:#E6DFBE; --ink-2:#A8A388; --rule:#4A4838; --ghost:#6E6B54;
  --hi-bg:#E6DFBE; --hi-fg:#1E1D15; --face:#2A2920; --grid:#33321F;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--mono);font-size:13px;line-height:1.55;overflow:hidden}
#app{display:grid;grid-template-rows:52px 1fr 30px;height:100vh;min-height:600px}
#top{display:flex;align-items:stretch;border-bottom:1.5px solid var(--ink);overflow:hidden}
.stat{padding:6px 14px 4px;border-right:1.5px solid var(--ink);min-width:0;white-space:nowrap}
.stat .k{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.stat .v{font-size:15px;font-variant-numeric:tabular-nums}
.stat.grow{flex:1;border-right:none;overflow:hidden}
#controls{display:flex;gap:8px;align-items:center;padding:0 14px;border-left:1.5px solid var(--ink)}
button.ctl{font:inherit;font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:var(--paper);color:var(--ink);border:1.5px solid var(--ink);padding:5px 10px;cursor:pointer;box-shadow:2px 2px 0 var(--ink);white-space:nowrap}
button.ctl:hover{background:var(--face)}
button.ctl:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
button.ctl:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
button.ctl.primary{background:var(--hi-bg);color:var(--hi-fg)}
button.ctl.primary:hover{background:var(--hi-bg);opacity:.9}
button.ctl:disabled{opacity:.4;cursor:default;box-shadow:none}
#main{display:grid;grid-template-columns:232px 1fr 440px;min-height:0}
#index{border-right:1.5px solid var(--ink);overflow-y:auto;padding:10px 8px 20px}
#index h4{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin:12px 4px 6px;font-weight:500}
#index h4:first-child{margin-top:2px}
.ix{display:flex;align-items:flex-start;gap:8px;width:100%;text-align:left;font:inherit;font-size:11.5px;line-height:1.3;background:var(--paper);color:var(--ink);border:1.5px solid var(--ink);padding:7px 8px;margin:0 0 6px;cursor:pointer;box-shadow:2px 2px 0 var(--ink);text-transform:uppercase;letter-spacing:.02em}
.ix .code{color:var(--ink-2);min-width:16px;font-size:10px;padding-top:1px}
.ix .nm{flex:1}
.ix .n{color:var(--ink-2);font-size:10.5px;font-variant-numeric:tabular-nums}
.ix.ghost{border-style:dashed;box-shadow:none;color:var(--ink-2)}
.ix.later{border-color:var(--rule);box-shadow:none;color:var(--ink-2);opacity:.75}
.ix.later .n{font-size:9px;letter-spacing:.06em}
.ix.new{outline:1.5px dashed var(--ink);outline-offset:2px}
.ix.on{background:var(--hi-bg);color:var(--hi-fg)}
.ix.on .code,.ix.on .n{color:var(--hi-fg);opacity:.75}
.ix:hover:not(.on){background:var(--face)}
.ix:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
#canvasWrap{position:relative;min-width:0;background:var(--paper)}
#svg{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#svg.dragging{cursor:grabbing}
#zoom{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
#zoom button{width:30px;height:26px;font:inherit;font-size:14px;background:var(--paper);border:1.5px solid var(--ink);color:var(--ink);cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
#rail{position:absolute;left:12px;top:12px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;max-width:calc(100% - 70px)}
#rail .ch{width:22px;height:22px;font:inherit;font-size:10px;background:var(--paper);border:1.5px solid var(--ink);color:var(--ink);cursor:pointer;padding:0;line-height:1}
#rail .ch.done{background:var(--face)}
#rail .ch.on{background:var(--hi-bg);color:var(--hi-fg)}
#rail .ch.locked{border-style:dashed;color:var(--ink-2)}
#rail .ch:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
#rail .title{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);margin-left:6px}
#rail .title b{color:var(--ink);font-weight:500}
#flowSel{position:absolute;left:12px;bottom:12px;display:none;gap:6px}
#flowSel button{font:inherit;font-size:10px;letter-spacing:.08em;text-transform:uppercase;background:var(--paper);border:1.5px solid var(--ink);color:var(--ink);padding:3px 8px;cursor:pointer}
#flowSel button.on{background:var(--hi-bg);color:var(--hi-fg)}
#tip{position:absolute;pointer-events:none;background:var(--hi-bg);color:var(--hi-fg);font-size:11px;padding:4px 8px;max-width:280px;line-height:1.35;display:none;z-index:5}
#panel{border-left:1.5px solid var(--ink);display:flex;flex-direction:column;min-height:0}
#tabs{display:flex;border-bottom:1.5px solid var(--ink)}
#tabs button{flex:1;font:inherit;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;padding:9px 6px;background:var(--paper);color:var(--ink);border:none;border-right:1.5px solid var(--ink);cursor:pointer}
#tabs button:last-child{border-right:none}
#tabs button.on{background:var(--hi-bg);color:var(--hi-fg)}
#tabs button:focus-visible{outline:2px solid var(--ink);outline-offset:-3px}
#body{overflow-y:auto;padding:14px 18px 40px;flex:1}
.eyebrow{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
h1.t{font-size:22px;font-weight:500;line-height:1.2;margin:2px 0 4px;text-wrap:balance}
.lede{font-size:14.5px;line-height:1.5;margin:0 0 14px;max-width:56ch}
.sub{color:var(--ink-2);font-size:11px;margin-bottom:14px}
h3.sec{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);font-weight:500;margin:20px 0 6px;padding-bottom:4px;border-bottom:1.5px solid var(--ink)}
#body p{margin:0 0 12px;max-width:62ch}
#body ul{margin:0 0 12px;padding-left:18px;max-width:62ch}
#body li{margin-bottom:6px}
mark{background:var(--hi-bg);color:var(--hi-fg);padding:0 3px}
.chip{display:inline-block;border:1.5px solid var(--ink);padding:1px 6px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;margin:0 6px 6px 0;background:var(--paper);color:var(--ink);font-family:inherit;cursor:pointer}
.chip.ghost{border-style:dashed;color:var(--ink-2)}
.chip.static{cursor:default}
pre{background:var(--face);border:1.5px solid var(--rule);padding:10px 12px;font-size:11px;line-height:1.45;overflow-x:auto;margin:0 0 12px;white-space:pre}
.step{display:grid;grid-template-columns:24px 1fr;gap:8px;margin:0 0 8px;font-size:12px}
.step .no{color:var(--ink-2);font-variant-numeric:tabular-nums}
.step.cur .no{color:var(--ink);font-weight:600}
.step.cur .tx{background:var(--face);outline:1.5px solid var(--ink);padding:2px 6px}
.actions{display:flex;gap:8px;margin:14px 0 0;flex-wrap:wrap}
.pk{border:1.5px solid var(--ink);padding:10px 12px;margin:0 0 12px}
.pk .lbl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.pk .route{font-size:12px;margin:2px 0 8px}
details{border-top:1.5px solid var(--rule);margin:8px 0 0;padding:6px 0 0}
details summary{cursor:pointer;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);list-style:none;display:flex;gap:8px;align-items:center}
details summary::before{content:'+';display:inline-block;width:12px;color:var(--ink)}
details[open] summary::before{content:'−'}
details summary::-webkit-details-marker{display:none}
details > *:not(summary){margin-top:8px}
#hint{border-top:1.5px solid var(--ink);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);display:flex;align-items:center;padding:0 14px;gap:14px;overflow:hidden;white-space:nowrap}
.q{padding-left:0;list-style:none}
.q li{position:relative;padding-left:18px}
.q li::before{content:'?';position:absolute;left:0;top:0;color:var(--ink-2)}
.q li.res::before{content:'✓'}
.q li.to::before{content:'→'}
.q li.res>span,.q li.to>span{color:var(--ink-2);text-decoration:line-through;text-decoration-color:var(--rule)}
.q li.to>span{text-decoration:none}
.q .ans{margin-top:2px;padding-left:10px;border-left:1.5px solid var(--ink)}
@keyframes halo{0%{opacity:.9}50%{opacity:.25}100%{opacity:.9}}
.halo{animation:halo 1.6s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.halo{animation:none}}
@media (max-width:1100px){#main{grid-template-columns:200px 1fr 360px}}
</style>

<div id="app">
  <div id="top">
    <div id="stats" style="display:flex;min-width:0;flex:1"></div>
    <div id="controls">
      <button class="ctl" id="btnBack">◂ Back</button>
      <button class="ctl primary" id="btnNext">Next ▸</button>
      <button class="ctl" id="btnFlow">‖ Pause</button>
      <button class="ctl" id="btnStep">Trace one step</button>
      <button class="ctl" id="btnReset">Refit</button>
    </div>
  </div>
  <div id="main">
    <nav id="index" aria-label="Structures"></nav>
    <div id="canvasWrap">
      <svg id="svg" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="currentColor" stroke-width="1.1"/></pattern>
          <pattern id="hatchLight" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="currentColor" stroke-width=".8" opacity=".55"/></pattern>
        </defs>
        <g id="world"></g>
      </svg>
      <div id="rail"></div>
      <div id="flowSel"></div>
      <div id="zoom"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button></div>
      <div id="tip"></div>
    </div>
    <aside id="panel">
      <div id="tabs">
        <button data-tab="what" class="on">What it does</button>
        <button data-tab="how">How it's built</button>
        <button data-tab="cond">Open questions</button>
      </div>
      <div id="body"></div>
    </aside>
  </div>
  <div id="hint">
    <span>enter / ] next chapter</span><span>[ back</span><span>hover to read</span><span>click to pin</span><span>→ go inside</span><span>← come out</span><span>click a dot to inspect its packet</span>
  </div>
</div>

<script>
const GROUPS = [{"id":"ui","title":"Screens"},{"id":"core","title":"Shell and runtime"},{"id":"inst","title":"The instance and the money"},{"id":"keys","title":"Keys and wallet"},{"id":"chat","title":"Chat, two ways"},{"id":"sup","title":"Under the floor"},{"id":"off","title":"Not built, or moving"}];
const NODES = [{"id":"OB","code":"OB","name":"Onboarding screen","short":"ONBOARDING","group":"ui","gx":0.5,"gy":1,"w":2,"d":2,"h":40,"kind":"screen","one":"First launch with no key anywhere: paste or generate an nsec as the claimant, or press esc to look around read-only.","what":"A masked field, a \"No key yet? Create a new one\" button, and a \"Just look around\" card. After a paste the card becomes a ready panel: profile name, short npub, and either the Lightning address, a \"could not check\" line, or a Coinos wallet offer. Enter starts the app.","how":"Shown only when both accounts are confirmed missing, decided once per launch (<code>shell.rs:215-224, 877-901</code>). Enter sends <code>Command::ImportKey { Claimant, Secret }</code>; \"Create a new one\" runs <code>Keys::generate()</code> on the UI thread and takes the same path (<code>shell.rs:904-960</code>). The runtime answers <code>AccountLoaded</code>, then <code>ProfileLoaded</code> only if a kind-0 was found, then <code>ImportReady { profile_checked, profile_found }</code>. A paste with no kind-0 gets an amber \"double-check you pasted the right one\"; a generated key does not (<code>onboarding.rs:150-166</code>). esc or cmd-. calls <code>leave_onboarding</code>: Dashboard as claimant, sidebar key input open if still keyless (<code>shell.rs:983-1005</code>).","steps":[["Decide","Both keys missing: Screen::Onboarding, active account Claimant, caret in the masked field."],["Paste or generate","Enter sends ImportKey; the button generates a key and sends the same command."],["Validate and store","Runtime checks the shape, writes the keychain, drops the cached session."],["Announce","AccountLoaded; a kind-0 probe through the instance; ProfileLoaded if found; ImportReady."],["Show","Name, npub, Lightning address or the Coinos offer; amber warning if a paste found no profile."],["Leave","Enter or esc: clear the field, Dashboard as claimant."]],"cond":["Esc while \"Checking the key…\": the key is stored and the account row updates, but the ready panel (address check, wallet offer) is lost (shell.rs:596-623).","The kind-0 probe reads the instance only; a profile that lives on public relays alone shows the wrong-key warning and a wallet offer.","The ready panel says \"Key saved to this Mac's keychain\" in debug builds too, where the key is a plain file."]},{"id":"DB","code":"DB","name":"Dashboard screen","short":"DASHBOARD","group":"ui","gx":3.5,"gy":1,"w":2,"d":2,"h":40,"kind":"screen","one":"The cmd-1 home: \"Needs attention\" derived from live state beside \"Recent activity\", the feed the runtime writes.","what":"Header: how many of the two keys loaded and which host the app watches. Card one lists up to three problems: claimant key missing, relay down, bounty list failed. Empty means an all-clear line. Card two is the activity feed, newest first. A button jumps to Bounties and opens the form for the active account.","how":"<code>attention_rows</code> (<code>dashboard.rs:106-145</code>) builds rows from <code>view(Claimant).missing</code>, <code>relay_connected</code> and <code>Load::Failed</code>. A missing issuer key is deliberately not a row: the app lists the house issuer's bounties without one. \"Keys loaded\" is claimed only when both npubs exist (<code>dashboard.rs:203-214</code>). Activity rows render <code>ActivityItem { dot, text, at }</code> with the time in UTC and a relative age (\"just now\", then s, min, h, d); a 30 s clock task repaints so ages move (<code>shell.rs:421-430</code>). The rail dot lives in <code>shell.rs:1535-1548</code>, not here.","steps":[["Summary","Count accounts with an npub; host is the API base with the scheme stripped."],["Attention","Claimant key missing, relay down, list failed: up to three rows, badge is the count."],["All clear","\"Loading the bounty list…\" while loading, else one of two green lines."],["Activity","Feed rows with dot, text, HH:MM:SS UTC and a relative age."],["CTA","Go to Bounties and open the form; keyless opens the key input instead."]],"cond":["A list failure after a good load only adds a red feed line; the stale list stays and \"Needs attention\" stays all-clear (shell.rs:670-676).","Absolute times are UTC, so a Nashville audience reads 16:13 for an 11:13 event (timefmt.rs:3-5)."]},{"id":"BO","code":"BO","name":"Bounties screen","short":"BOUNTIES","group":"ui","gx":6.5,"gy":1,"w":2.5,"d":2.5,"h":44,"kind":"screen","one":"cmd-2: the issuer's bounties beside a detail pane with one payment timeline per claim; the two forms render above both.","what":"A 300 px list (d-tag, status pill, sats, paid x/y, auto-pay) and a detail pane (criteria, reward, cap, min rank, slots, then claim cards). Up and down arrows or a click select a bounty and start watching it. Each claim card is a dot-and-line timeline built from the claim's payment row and its zap receipt.","how":"<code>bounties.rs:657-716</code> renders from Shell state; <code>select</code> sends <code>Command::WatchBounty</code> and retargets an open claim form (<code>shell.rs:1108-1128</code>). Card rows (<code>bounties.rs:240-332</code>): \"Claim submitted\"; \"Auto-pay blocked: reason\" if the server set one; a retroactive \"Auto-pay attempted\" from the row's created_at, because a 2 s poll usually misses the attempting state; one row for the current state; \"Zap receipt id… · N sats · N s after the claim\". State text: attempting \"Auto-pay attempting…\", paid \"Paid — waiting for the zap receipt\", settled \"Payment settled\", paid_unreceipted \"Paid, no receipt (reason)\", failed \"Auto-pay failed (reason)\", anything else \"Payment state: other\", no row \"No auto-payment row yet\". List and claims scroll independently so the header stays pinned.","steps":[["Load","Loading, Failed with Retry (cmd-R), empty, or rows."],["Select","Click or arrows set the selection and send WatchBounty; idempotent for a live watcher."],["Detail","Snapshot from details, else the list, else the optimistic copy of a just-created bounty."],["Claim cards","Current state plus a retroactive \"Auto-pay attempted\"; the other transitions live in the feed."],["Forms","cmd-N: seven fields for the issuer, one field for the claimant, above both panes."]],"cond":["A claim with no created_at gets timestamp 0: a 1970 time and a huge receipt delta (bounties.rs:242).","Up and down do nothing off this screen, while the list is loading or failed, or when it is empty (shell.rs:1129-1139).","The card ignores Claim.payment_status and payment_amount_sats; is autoPayment the only source of truth?"]},{"id":"NR","code":"NR","name":"Rail, sidebar and shortcuts","short":"RAIL+SHORTCUTS","group":"ui","gx":0.5,"gy":4.5,"w":3,"d":1.5,"h":22,"kind":"slab","one":"Seventeen shortcut bindings for sixteen actions, a 70 px rail with both account markers and the relay dot, and a sidebar with the paste-a-key card.","what":"cmd-1 to cmd-8 switch screens even from inside a text field. cmd-[ and cmd-] switch account. cmd-N opens a form, cmd-R refreshes, esc or cmd-. cancels. The sidebar shows the active account's name, npub and payout address, \"Forget this key\" when a key exists, three sats cards, and the paste-a-key card when something opened it.","how":"<code>keybindings()</code> (<code>shell.rs:109-138</code>): the cmd bindings have no context so they fire inside inputs; up, down and enter are scoped to key context \"Shell\" so a focused input's own Enter wins (<code>shell.rs:2114-2120</code>). <code>step_account</code> toggles Issuer and Claimant (<code>shell.rs:1089-1095</code>). The paste card opens on cmd-] into a keyless slot (caret in it), cmd-N as a keyless account, a click on the sidebar header, or leaving onboarding keyless; esc closes it (<code>shell.rs:1026-1080, 1157-1168</code>). It imports into whichever account is active, issuer included, with an amber \"Operators only\" note. Rail markers show the kind-0 picture, else initials in the account hue, else a dashed \"?\" (<code>shell.rs:1450-1481</code>). The dot is GREEN when <code>relay_connected</code>. Sidebar stat cards: open bounties, committed sats, settled to date (receipted payouts only).","steps":[["Bind","main.rs installs the bindings after gpui_kit::init."],["Dispatch","The root element tracks focus, key context Shell, sixteen on_action handlers."],["Switch account","cmd-] into a keyless slot opens the paste card focused; submit or esc returns focus to the shell."],["Paste a key","Enter sends ImportKey for the active slot; AccountLoaded closes the card."],["Forget","Deletes the keychain entry only; the runtime re-announces, so an env key comes back."]],"cond":["While a text field has focus, cmd-[ and cmd-] indent instead of switching accounts; the binding is gpui-kit's (shell.rs:864-866). Rebind, or document only?","The top-bar search field reads \"Search lists, bounties, profiles…\" and has no handler (shell.rs:456-458, 1904). Hide it until built?"]},{"id":"AC","code":"AC","name":"Accounts and Account screens","short":"ACCOUNT","group":"ui","gx":3.5,"gy":7,"w":2,"d":2,"h":40,"kind":"screen","one":"The rail's Accounts button lists every stored account; each card's Manage opens one account's page: header plus five tabs, of which Trust is the one with real data.","what":"Accounts renders one card per account in store order — avatar, name, short npub, \"active\" pill, balance, Switch and Manage. The Account page shows the account it was opened for (not necessarily the active one): \"← All accounts\", avatar, name, short npub, \"View profile\" to brainstorm.world, \"Switch to this account\" when inactive. Tabs: Identity & keys, Trust, Progress, Wallet, Limits & defaults — the four others say \"Not built yet.\" The Trust tab is five cards: Treasure Map (kind-10040 verdict, relays that returned it, rank row, raw event), Trusted Assertions (kind-30382 from the account's provider and the instance issuer's, in two labelled groups), Minimum rank (INSTANCE_MIN_RANK, read-only), Trust Determination (owner PoV, read-only), Web of trust (follows and verified followers).","how":"<code>src/account.rs</code> renders both screens from <code>shell.views()</code> plus <code>shell.trust</code>, the per-pubkey <code>TrustState</code> map in <code>src/trust_state.rs</code>. <code>Shell::open_account(pubkey, tab)</code> sets <code>account_page</code> and goes to <code>Screen::Account</code>; entry points are the dashboard's Fix rows, Accounts › Manage, and the sidebar account chip (its chevron alone still steps accounts, via stop_propagation). Raw-event toggles and the \"copied\" tick live on <code>AccountPage</code>. Every event the tab shows was signature-verified in <code>trust.rs</code>; a failed read says so and keeps the prior answer instead of reading as absence.","steps":[["Open","Dashboard \"Fix →\", Accounts › Manage, or the sidebar chip: open_account(pubkey, Trust)."],["Fetch","A stale or never-run read kicks Command::FetchTrust; TrustState::begin bumps the generation and marks parts Loading."],["Render","Five cards; each part renders its verdict, a failure note, or \"Checking…\"."],["Tabs","The other four tabs render \"Not built yet.\""]],"cond":[]},{"id":"WA","code":"WA","name":"Wallet screen","short":"WALLET","group":"ui","gx":4.5,"gy":4.5,"w":2,"d":2,"h":40,"kind":"screen","one":"cmd-6: one card with the account's Lightning address, a funding QR, the Coinos username, and the create or retry button.","what":"The same panel sits inside the onboarding ready panel. It shows the wallet created in this launch first, else the profile's lud16. With an address: the QR and \"Scan with Strike or any Lightning wallet to add sats.\" Without one: an amber note and \"Create a Coinos wallet for this key\" for the claimant, or \"The house key's wallet is not managed here.\" for the issuer.","how":"<code>wallet::panel</code> (<code>wallet.rs:128-224</code>) reads <code>AccountView.payout_address()</code> and <code>WalletState { submitting, created, error, qr }</code>. <code>sync_qr</code> re-encodes only when the address changes: <code>lnurl_pay</code> builds https://domain/.well-known/lnurlp/user for whatever domain the address carries and bech32-encodes it (HRP lnurl, original checksum, uppercase), then <code>QrCode::new(\"lightning:LNURL1…\")</code>. The QR is a gpui canvas: one black <code>paint_quad</code> per dark module, 220 px, 4-module quiet zone, no image crate (<code>wallet.rs:91-125</code>). The username line and \"Copy username\" appear only for a wallet created in this launch; the password never reaches this module. \"Retry publishing\" re-sends the same command.","steps":[["Open","cmd-6 or the onboarding ready panel."],["Address","The wallet created in this launch, else lud16 from the profile."],["QR","lightning: plus the uppercase LNURL, painted module by module."],["Create","Button sends CreateCoinosWallet; claimant only."],["Retry","Publish failed: amber note, error text, Retry publishing."]],"cond":["The QR encodes only the LNURL (LUD-01); wallets that prefer LUD-16 text must decode it. Intended?","Retry re-runs the whole command including the Coinos probe, so a Coinos outage blocks a pure relay retry (nostr.rs:740-745).","After a relaunch the username is gone from the panel; only the address remains. Fine?"]},{"id":"CP","code":"CP","name":"Chat pane","short":"CHAT PANE","group":"ui","gx":0.5,"gy":7,"w":2,"d":2,"h":40,"kind":"screen","one":"cmd-8: an in-memory transcript and a composer that streams Claude replies token by token straight from Anthropic, on the window's own executor.","what":"Enter sends the whole transcript to the Anthropic Messages API; each text chunk lands in the pending bubble, which renders as markdown. Shift+Enter makes a new line. Nothing persists: quit and it is gone. The key comes from ANTHROPIC_API_KEY or ~/.config/anthropic/key. This is the one network path that bypasses the runtime thread.","how":"<code>chat.rs:25-29</code>: MODEL claude-sonnet-5, MAX_TOKENS 64000, API_URL api.anthropic.com/v1/messages. <code>send</code> pushes the user message and an empty assistant bubble, builds the body from every non-empty message with no system prompt, takes <code>cx.http_client()</code> (gpui's own reqwest client from <code>main.rs</code>) and <code>cx.spawn</code>s <code>stream_reply</code> on gpui's foreground executor, holding the Task in <code>_stream</code> because gpui tasks cancel on drop (<code>chat.rs:119-156</code>). Because the body is polled there, only <code>ReqwestClient::user_agent</code> is safe; the read-timeout constructor aborts the process (<code>main.rs:73-80</code>). The SSE body is read line by line; content_block_delta text is appended, a max_tokens stop adds an italic note, an error event replaces the bubble with \"Something went wrong\" (<code>chat.rs:322-354</code>). The Chat entity is built once and lives as long as the Shell, so the transcript survives screen switches.","steps":[["Enter","PressEnter, not shift, not streaming, non-empty: composer cleared."],["Bubbles","User message plus an empty assistant bubble shown as \"thinking…\"."],["Request","POST with stream:true and the full transcript; headers anthropic-version and x-api-key."],["Stream","Each content_block_delta appends text, scrolls to bottom, repaints."],["Finish","Error text or \"The model sent an empty reply.\" replaces the bubble."]],"cond":["Error bubbles, including the \"No API key\" notice, are resent to the model as assistant turns on the next Enter, because only empty messages are filtered (chat.rs:139).","No cancel while streaming; the only way out is to close the window (chat.rs:91, 152).","A mid-stream error overwrites the text already streamed (chat.rs:172). Keep the partial reply?","message_stop is never checked; a reply is \"done\" when the connection closes, so a graceful cut-off looks finished (chat.rs:351).","The whole transcript is resent every turn with no cap and no caching; cost grows linearly."]},{"id":"SH","code":"SH","name":"Shell","short":"SHELL","group":"core","gx":10,"gy":1.5,"w":3,"d":3,"h":70,"kind":"tall","one":"The one gpui view that owns every piece of key, account and bounty state and paints rail, sidebar, top bar and the active screen.","what":"Which screen is up, which of the two identities is active, what the runtime knows about each key and profile, the bounty list and per-bounty snapshots, the open form, the activity feed. Nothing else holds key, instance or bounty state; the Chat pane keeps only its own transcript. Every Update from the runtime is folded into this struct, then the frame repaints.","how":"<code>Shell</code> (<code>shell.rs:342-388</code>): <code>screen</code>, <code>account</code> (Issuer at launch), <code>issuer</code> and <code>claimant: AccountView</code>, <code>relay_connected</code>, <code>activity</code>, <code>bounties: Load&lt;Vec&lt;Bounty&gt;&gt;</code>, <code>selected</code>, <code>details</code>, <code>optimistic</code> (a just-created bounty until the server echoes it), the three forms, <code>onboarding</code>, <code>first_screen_decided</code>, <code>pending_bounty</code> (the bounty half parked while the DList publishes), <code>commands</code>, <code>chat</code>, <code>focus</code>. <code>apply</code> (<code>shell.rs:532-843</code>) matches all seventeen Update variants and ends with <code>cx.notify()</code>. <code>main.rs</code> builds it inside a Root after theme, palette, shortcuts and the HTTP client, in a 1180x800 window.","steps":[["Boot","main.rs: theme Dark, palette::apply, bind_keys, set_http_client, open the window, Root(Shell)."],["Shell::new","Take focus back from the Chat composer, spawn the runtime, then send Connect, LoadAccounts, FetchBounties."],["First screen","Onboarding only when both keys are confirmed missing, decided once."],["Render","Onboarding fills the window; otherwise rail | sidebar | top bar + main."],["Apply","One Update, one state change, one cx.notify."],["Chain","DListPublished sends CreateBounty; BountyCreated and ClaimPublished send WatchBounty; a fresh bounty list selects and watches the first row when nothing is selected."]],"cond":["Command::Shutdown exists but nothing sends it; the runtime thread dies with the process. Intentional?","Every unbounded_send drops its Result; if the runtime thread died, a submit does nothing beyond the earlier Error { Runtime } line."]},{"id":"BR","code":"BR","name":"Runtime bridge","short":"BRIDGE","group":"core","gx":10.5,"gy":5.5,"w":2,"d":1.5,"h":30,"kind":"gate","one":"Two unbounded channels: Commands go down fire-and-forget, Updates come up and are drained by one gpui task into Shell::apply.","what":"The only contact between the window and the runtime thread. Eleven Command variants down, seventeen Update variants up. Every Update is a deduplicated fact: the runtime decides what is new, the Shell only records it. Secrets cross only inside a wrapper that prints redacted.","how":"<code>spawn_runtime()</code> returns <code>NostrHandle { commands: UnboundedSender&lt;Command&gt;, updates: UnboundedReceiver&lt;Update&gt; }</code> (<code>nostr.rs:240-243</code>). The Shell keeps the sender and hands the receiver to <code>cx.spawn_in</code>: <code>while let Some(update) = updates.next().await { shell.apply(update) }</code>, held in <code>_updates</code> so dropping the Shell cancels it (<code>shell.rs:407-419</code>). Commands: Connect, LoadAccounts, FetchBounties, PublishDList, CreateBounty, PublishClaim, ImportKey, ForgetKey, CreateCoinosWallet, WatchBounty, Shutdown. Updates: RelayStatus, AccountLoaded, AccountMissing, ProfileLoaded, ImportFailed, ImportReady, Bounties, BountiesFailed, BountyDetail, DListPublished, BountyCreated, ClaimPublished, PaymentState, ReceiptSeen, WalletCreated, WalletFailed, Error { source }. An Error fails a form only when its source is that form's own command (<code>shell.rs:815-841</code>).","steps":[["Send","commands.unbounded_send(Command::…), result ignored."],["Dispatch","Connect is awaited inline and WatchBounty aborts the old watcher inline; every other command is tokio::spawned."],["Emit","The task sends one Update per fact."],["Drain","The gpui task awaits the next Update and calls apply."],["Repaint","apply ends with cx.notify; one frame per Update."]],"cond":["Both channels are unbounded; a window that stops draining never applies backpressure. Fine for one window?"]},{"id":"RT","code":"RT","name":"Runtime thread","short":"RUNTIME","group":"core","gx":10,"gy":8,"w":3,"d":3,"h":70,"kind":"tall","one":"An OS thread named nostr-runtime with its own two-worker tokio runtime; everything that talks Nostr, the instance or Coinos lives here.","what":"gpui's executor is not tokio, and nostr-sdk and reqwest need tokio. So the network half is a second thread with its own runtime, and the window never awaits a tokio future. The thread owns one relay client, one session per account for writes, throwaway keyless clients for reads, the live bounty watcher, and the ledgers.","how":"<code>spawn_runtime</code> (<code>nostr.rs:263-303</code>): install the ring TLS provider, open the two channels, start the thread, <code>block_on(run)</code>. <code>run</code> (<code>nostr.rs:327-484</code>) builds <code>Client::default()</code>, adds <code>relay_url()</code>, spawns the 3 s status poller, and loops over Commands. Every command except Connect, WatchBounty and Shutdown is <code>tokio::spawn</code>ed with the update sender; publish and wallet work also gets the sessions map, while LoadAccounts and FetchBounties read keys directly and build their own keyless Api. <code>Session { keys, api, logged_in }</code> is built lazily per account behind two mutexes (<code>nostr.rs:492-509</code>); ImportKey and ForgetKey evict it so a cached session never signs with a stale key. Errors fold into <code>BridgeError</code> and go out tagged with an <code>ErrorSource</code> (Runtime, Accounts, DList, Bounty, Claim, Watch).","steps":[["Install ring","rustls::crypto::ring::default_provider().install_default() before any client."],["Spawn","std::thread \"nostr-runtime\", tokio multi_thread with 2 workers."],["Relay","Client::default(), add_relay, spawn watch_relay_status."],["Dispatch","Match each Command; tokio::spawn account work and watches."],["Sessions","First write per account: read the key, build an Api with its own cookie jar."],["Shutdown","Break the loop, abort the poller and watchers, disconnect. Never sent today."]],"cond":["spawn_runtime reports a thread or tokio build failure as Error { Runtime }, but the handle then has no live receiver. Does the UI treat that as fatal?",{"q":"No 401 handling resets Session.logged_in; only re-pasting the key evicts the session, so an expired cookie turns CreateBounty into 401 until then (nostr.rs:535-538, 868).","r":"create_bounty now treats a 401 as an expired session: it clears logged_in, logs in again on the same cookie jar and retries once. The server cookie lasts 24 h with no rolling renewal (magic-carpet-v2/src/middleware/sessionStore.js:9,146; fixed 2026-09-22)."}]},{"id":"FM","code":"FM","name":"Forms","short":"FORMS","group":"core","gx":14,"gy":1,"w":2,"d":2,"h":30,"kind":"cards","one":"cmd-N: the issuer's seven-field \"New DList + bounty\" form or the claimant's one-field claim form; Enter advances and submits.","what":"Issuer fields: item singular, items plural, list description, bounty criteria, reward per item (100), bounty cap (400), auto-pay minimum rank (2). Five are checked before anything publishes, because the DList goes out first and cannot be unpublished; plural and description are optional. Claimant field: the item name for the selected bounty.","how":"<code>new_item</code> (<code>shell.rs:1157-1177</code>): keyless account opens the sidebar key input instead; else go to Bounties and open by role. <code>submit_bounty_form</code> (<code>shell.rs:1253-1366</code>) validates singular, criteria, reward, cap and rank, parks a <code>CreateBounty</code> in <code>pending_bounty</code> with <code>reward_per_item: true</code>, <code>max_rewards_per_npub: 1</code>, <code>auto_pay: true</code> hardcoded, and sends <code>PublishDList</code>. <code>DListPublished</code> fills the coordinate and sends <code>CreateBounty</code>; <code>BountyCreated</code> closes the form, selects the id, builds the optimistic card, sends <code>WatchBounty</code> and <code>FetchBounties</code>. The claim form snapshots bounty id and coordinate and sends <code>PublishClaim</code> (<code>shell.rs:1368-1428</code>). A form-scoped Error re-enables the form with the message.","steps":[["Open","cmd-N or the CTA; keyless goes to the key input."],["Fill","Enter in field N focuses N+1; Enter on the last submits."],["Validate","Empty singular or criteria, non-positive sats, cap below reward, bad rank: caret returns to the field."],["Publish DList","PublishDList; the bounty half waits in pending_bounty."],["Create bounty","On DListPublished: CreateBounty with the coordinate."],["Claim","One field, Enter sends PublishClaim; a sticky toast explains the rank gate."]],"cond":["esc between PublishDList and DListPublished orphans the DList: published and logged, no bounty (shell.rs:1187, 692-693).","autoPay is hardcoded true, so an issuer off the server allowlist gets 403 every time. Is a manual-pay bounty ever needed from this UI?","An open, unsubmitted claim form retargets to whichever bounty you arrow to (shell.rs:1116-1127). Intended for a stage demo?"]},{"id":"AF","code":"AF","name":"Activity feed","short":"ACTIVITY","group":"core","gx":14,"gy":4,"w":2,"d":2,"h":26,"kind":"store","one":"Newest-first, capped at 200 rows, in memory only; dedup is the runtime's job, not the feed's.","what":"Every notable Update writes one line: key imported, wallet ready, DList published, bounty created, claim submitted, each payment state change, each zap receipt, each error. Payment and receipt lines carry the server's timestamp, so a fact learned late never reads as instant.","how":"<code>push_activity</code> inserts at index 0 and truncates to 200 (<code>shell.rs:510-513</code>). Writers live in <code>apply</code> (<code>shell.rs:596-841</code>): PaymentState maps attempting, paid, settled, paid_unreceipted and failed to a dot colour and text using the claim's item name; ReceiptSeen writes \"Zap receipt … landed N s after the claim\". The feed never dedups: the runtime keeps one <code>WatchLedger</code> per bounty that outlives its watcher, so re-watching never replays (<code>nostr.rs:347-350</code>). The first watch of an old bounty this launch writes one line per claim with its current state, plus one per receipt, with their old timestamps.","steps":[["Write","apply calls push_activity(dot, text, at)."],["Timestamp","PaymentState.ts and ReceiptSeen.at when present, else arrival time."],["Render","Dashboard rows, or \"Nothing yet — claims, payments, and receipts appear here live.\""],["Age","A 30 s clock repaints so \"N min ago\" moves."]],"cond":["A relaunch loses the feed and re-selecting a bounty replays its history once more. Should it read server history?","Rows always insert at index 0, so a late poll with an old server timestamp can appear above newer rows."]},{"id":"EV","code":"EV","name":"Event builders","short":"EVENTS","group":"core","gx":14,"gy":7.5,"w":2,"d":2,"h":30,"kind":"cards","one":"Builds kind-39998 DList headers and kind-39999 claims exactly like the server's dtag.js, and reads kind-9735 receipts.","what":"A DList header is a replaceable event whose d-tag is the slug of the singular name; its coordinate ties the bounty to it. A claim names one item, carries the DList coordinate in a z tag, and holds the item name twice so old tooling reads it. A receipt is reduced to payer, claim ids and amount.","how":"<code>slug</code> (<code>events.rs:40-59</code>): lowercase, NFD, drop combining marks, keep ASCII letters and digits, collapse the rest to one hyphen. <code>hash8</code>: SHA-256, first 8 hex chars. Header: kind 39998, content \"\", tags <code>d</code>=slug(singular), <code>names</code>=[singular, plural], optional <code>description</code> (<code>events.rs:91-126</code>). Claim: kind 39999, content=name, tags <code>d</code>=slug(name)-hash8(coordinate), exactly one <code>z</code>=coordinate, <code>name</code> (<code>events.rs:135-158</code>). Receipt: the payer is the pubkey inside the <code>description</code> JSON, never the signer, which is the provider's zapper key; amount from the bolt11 invoice (<code>events.rs:200-234</code>). Tests pin the header d-tag, the coordinate and the receipt parse against the prod fixture; the fixture's claim was made by the agent CLI with its own d-tag scheme.","steps":[["slug","\"Café  du Monde!\" becomes cafe-du-monde."],["hash8","First 8 hex chars of SHA-256 of the coordinate."],["Header","Kind 39998; coordinate 39998:pubkey:dtag."],["Claim","Kind 39999; d-tag memphis-a0576ef1 for \"Memphis\" on the rehearsal DList."],["Receipt","Kind 9735 only; e tags are claim ids, bolt11 gives msats."]],"cond":[{"q":"slug keeps only ASCII alphanumerics after NFD, so a Cyrillic or CJK name slugs to empty and claim() errors. Does dtag.js do the same?","r":"Yes: dtag.js slugs them to empty too and returns \"-<hash8>\" without complaint; the app refuses instead (magic-carpet-v2/src/lib/dtag.js:23-29, verified 2026-09-10)."},"The live fixture claim uses d-tag mc-1786093454-7 and no name tag; the server keys on the z tag, so both schemes work. Will it stay that way?"]},{"id":"BW","code":"BW","name":"Bounty watcher and ledger","short":"WATCHER","group":"core","gx":14,"gy":10.5,"w":2,"d":2,"h":36,"kind":"job","one":"This app's one live watcher polls the bounty detail at 2, 10 or 30 s; a per-bounty ledger makes every payment fact reach the feed exactly once.","what":"Selecting a bounty starts its watcher and stops any other. Each loop fetches the detail, sends the snapshot when it changed, and asks the ledger what is new: a payment state transition, a zap receipt. A receipt pushed by the relay only shortens the wait; the server's copy is the fact. The watch ends when the bounty is terminal with nothing pending.","how":"<code>watch_bounty</code> (<code>nostr.rs:1102-1261</code>): fresh keyless Api, GET /api/bounties/{id}; interval 2 s while a payment is pending, 10 s on an open auto-pay bounty, 30 s manual; errors back off 2 to 60 s, one Error { Watch } per distinct message. A claim with no payment row counts as pending for ROWLESS_GRACE_SECS (600) on an open auto-pay bounty; after that the poll just slows to 10 s, with no line anywhere. Subscription <code>Filter kind 9735 .events(all claim ids)</code> on the instance relay, re-issued when the claim set changes, never while the bounty has no claims. <code>WatchLedger { claim_created, last_payment, seen_receipts, relay_triggered }</code> (<code>nostr.rs:975-1084</code>) emits PaymentState when (state, reason) changed and ReceiptSeen once per receipt id; secs_from_claim is receipt.created_at minus claim.created_at. paid_unreceipted is not pending, but the watch stays alive while the bounty is open so a late settled flip is caught.","steps":[["Start","WatchBounty: keep a live watcher for this id, else abort the others and spawn with the persistent ledger."],["Poll","GET the detail; on change emit BountyDetail first."],["Ingest","The ledger yields new PaymentState and ReceiptSeen facts."],["Pace","Terminal and nothing pending: stop. Else sleep 2, 10 or 30 s."],["Subscribe","Claim ids changed: resubscribe kind 9735 by #e."],["Wake early","A verified pushed receipt the ledger accepts ends the sleep now."]],"cond":["Silent server gates (rank below min rank, daily cap) leave no row and no log line, and the app never says so: after 600 s the poll slows from 2 s to 10 s. Should the app preflight rank before claiming?","After the watch ends, re-selecting a settled bounty does one poll and stops again. Enough for the receipt exhibit in the demo?","nostr-sdk pushes an event only the first time the client sees it; a receipt already pushed under an earlier watcher is not re-pushed, so the poll is its only path."]},{"id":"IA","code":"IA","name":"Instance API client","short":"API CLIENT","group":"core","gx":10,"gy":12,"w":3,"d":2,"h":28,"kind":"slab","one":"reqwest clients for the instance: one per account with a cookie jar for writes, throwaway keyless ones for reads; challenge login, bounties, the publish door, profile scans.","what":"The issuer's and claimant's sessions never cross. The login signs a kind-22242 challenge and keeps the cookie; only creating a bounty needs it. Publishing an event is a plain POST with the signed event. Response types mirror what the server sends, including the payment row and the receipt per claim.","how":"Base <code>https://magic-carpet.brainstorm.world</code>, override <code>MC_BASE_URL</code>, 20 s timeout, user agent magic-carpet-chat/version (<code>api.rs:20-30, 373-388</code>). <code>login</code>: POST /api/auth/verify-user {pubkey}, sign kind 22242 with content \"Tapestry authentication\" and a challenge tag, POST /api/auth/login-user {event} (<code>api.rs:435-463</code>). <code>create_bounty</code>: POST /api/bounties, camelCase, unset flags omitted. <code>list_bounties</code>: GET /api/bounties?issuer=hex&status=all. <code>get_bounty</code>: GET /api/bounties/{id}. <code>publish_event</code>: POST /api/strfry/publish {event, signAs:\"client\"}; an HTTP 200 carrying success:false is <code>ApiError::Rejected</code>, and scan answers the same shape. <code>scan</code>: GET /api/strfry/scan?filter= for kind-0 lookups. Booleans stay raw because SQLite sends 0/1.","steps":[["Build","cookie_store(true), 20 s timeout, base from env or the default."],["Login","verify-user, sign 22242, login-user; cookie in the jar; once per session."],["Create","POST /api/bounties with the cookie; the server takes the issuer from the session."],["Read","list and detail are public GETs from throwaway clients."],["Publish","POST /api/strfry/publish; success:false is still a failure."],["Scan","A Nostr filter as a query string; the app uses it for profiles."]],"cond":["list_bounties and get_bounty bypass the read() helper: a non-2xx gives 200 chars of raw body instead of the server's error field (api.rs:494-498).",{"q":"Claim.autoPayBlockedReason and paymentClaimEventId are parsed but absent from the fixture; does the server send them?","r":"The current server sends paymentClaimEventId and claimAddress on every claim; autoPayBlockedReason only when the daily limit blocks a payable claim. The 2026-08-07 fixture predates them (magic-carpet-v2/src/api/bounties.js:118-133, 206-207, verified 2026-09-10)."}]},{"id":"IN","code":"IN","name":"Magic Carpet instance","short":"INSTANCE","group":"inst","gx":18,"gy":1,"w":3.5,"d":2.5,"h":30,"kind":"slab","one":"The server at magic-carpet.brainstorm.world: a REST API in front of a strfry relay, holding bounties, claims, payment rows and receipts.","what":"The app reads and writes only here. Bounties and payment state come from GET /api/bounties. Events go in through POST /api/strfry/publish, which pipes them into strfry. Login is a signed challenge. The house issuer 853baa94… is the default whose bounties the app lists; an imported issuer key or MC_ISSUER_NPUB overrides it.","how":"Lives in the sibling repo magic-carpet-v2. The publish route runs the global auth middleware but is absent from its write list, so it falls through as read-only access; it checks only that id, sig and pubkey are present and never verifies the signature before <code>strfry import</code> (10 s timeout). verify-user mints the session cookie and accepts any well-formed pubkey; the real gate is on POST /api/bounties, where autoPay needs owner, admin or AUTO_PAY_ALLOWLIST_PUBKEYS (403 otherwise). Claims from keys ranked below 2 are hidden from claims[] unless they already hold a payment row. The detail endpoint embeds the auto_payments row and the validated kind-9735 per claim; the server checks the receipt's description pubkey against the issuer or its delegate, which this app cannot know. A kind-0 posted through the door is also fanned out to the server's own profile relays.","steps":[["Publish","POST /api/strfry/publish: presence check, strfry import."],["Login","verify-user mints the cookie and stores a challenge; login-user checks pubkey, challenge tag and Schnorr signature."],["Create","POST /api/bounties: authed, normalized, allowlist-gated for auto-pay."],["List and detail","Public GETs with derivedStatus, paymentState, claims[].autoPayment, claims[].zapReceipt."]],"cond":[{"q":"MC_BASE_URL and MC_RELAY_URL exist for rehearsals; does the repo-root .env set them?","r":"The binary reads no .env: no dotenv crate, no read in src/. Overrides must be in the launching shell (Cargo.toml at HEAD, verified 2026-09-10)."}]},{"id":"RL","code":"RL","name":"Instance relay","short":"RELAY","group":"inst","gx":18,"gy":4.5,"w":2,"d":2,"h":30,"kind":"store","one":"wss://magic-carpet.brainstorm.world/relay: the socket behind the rail dot and the kind-9735 receipt subscriptions, never a publish target.","what":"The runtime holds one nostr-sdk client on it. Every 3 s it reads the real connection status and tells the window only when it changed. The bounty watcher subscribes here for receipts that name its claim ids, but a pushed receipt is only a reason to poll sooner.","how":"<code>INSTANCE_RELAY</code> (<code>nostr.rs:28</code>), override <code>MC_RELAY_URL</code>. <code>Command::Connect</code> calls <code>client.connect()</code> without waiting. <code>watch_relay_status</code> (<code>nostr.rs:951-973</code>) polls <code>relay.status() == Connected</code> and emits <code>RelayStatus(bool)</code> on change; the first poll always emits. No event is ever sent through this client; the throwaway client for public relays is separate.","steps":[["Add","run() adds the relay once; a bad URL is Error { Runtime } and the loop continues."],["Connect","Idempotent, returns at once."],["Poll","Every 3 s: connected or not; emit on change."],["Subscribe","Per watched bounty: kind 9735 with #e = claim ids."]],"cond":["The dot reflects this socket only; API reachability shows up separately as a failed list row.","\"Relay disconnected\" has no retry button. Is reconnect fully automatic in nostr-sdk, or can the user get stuck?"]},{"id":"AP","code":"AP","name":"Auto-pay watcher (server)","short":"AUTO-PAY","group":"inst","gx":21.5,"gy":4.5,"w":2,"d":2,"h":36,"kind":"job","one":"The instance's own process that pays claims. It lives in magic-carpet-v2, not here; this app only watches its rows.","what":"Every 30 s it lists payable claims, skips self-claims and anyone below the bounty's minimum rank, writes attempting, pays the claimant's Lightning address, writes paid, waits up to 60 s for a zap receipt, then writes settled or paid_unreceipted with reason receipt_timeout. A throw before the send writes failed; a missing Lightning address is one such throw, so it is not silent.","how":"<code>magic-carpet-v2/src/services/autoPayWatcher.js</code>: <code>runAutoPayTick</code> on AUTO_PAY_INTERVAL_MS; the rank gate is a bare <code>continue</code> with no row and no log line (463-464); the daily cap refuses inside insertAttemptingPayment with no row; no lud16 writes attempting then failed \"claimant has no Lightning address\" (114-147, 189-197); a throw after the invoice is persisted asks the wallet and lands as paid, failed, or failed with reason ambiguous_send. Every tick first turns attempting rows older than 600 s into failed (stuck_timeout). <code>payBolt11</code>, then <code>pollForReceipt</code> in 5 s steps bridging AUTO_PAY_ZAP_RELAYS. The receipt is signed by the claimant's provider (Strike's zapper for Matthias); the payer inside its description is the delegate, the key the server zaps from on the issuer's behalf. Wallet float and the 5,000 sat daily limit are on the server.","steps":[["Tick","Every 30 s, list payable claims."],["Gate","Self-claim or below min rank: continue, silently. Daily cap: refused, no row."],["Attempt","Row state attempting; no lud16 fails here with a reason."],["Pay","Send sats to the lud16; row paid."],["Receipt","Wait 60 s; settled, or paid_unreceipted (receipt_timeout)."]],"cond":["Two server gates: below rank 2 the claim is hidden, between 2 and min rank it is listed but never paid. Should the app show which gate applies?","The project notes list a missing lud16 among the silent no-row gates; the watcher code writes a failed row for it. Which is current on prod?"]},{"id":"PR","code":"PR","name":"Public relays","short":"PUBLIC RELAYS","group":"inst","gx":18,"gy":7.5,"w":2,"d":2,"h":30,"kind":"store","one":"relay.damus.io, nos.lol and relay.primal.net: written once, when a Coinos address is added to the profile, because payers read them.","what":"Strike, Primal and the server's payer look up a Lightning address on the public relays, so the merged kind-0 must land there. It goes to the instance first so this app's own kind-0 probe, which reads only the instance, sees the address at once. One public acceptance is enough.","how":"<code>PUBLIC_RELAYS</code> (<code>nostr.rs:35-39</code>). <code>publish_lud16</code> (<code>nostr.rs:649-689</code>) uses a throwaway <code>Client::default()</code>: add the three relays, <code>connect().and_wait(10 s)</code>, <code>send_event</code>, disconnect; Ok only if <code>output.success</code> is non-empty. A failure after the instance accepted travels inside <code>WalletCreated.publish_error</code> and the panel offers Retry.","steps":[["Instance first","POST /api/strfry/publish; a refusal stops here."],["Connect","Throwaway client, wait up to 10 s."],["Send","The same signed kind-0."],["Judge","Any one relay accepted: success."]],"cond":["publish_lud16 reads the existing kind-0 from the instance only; a newer profile on the public relays gets replaced by the instance copy plus lud16.","Instance and public relays are written in sequence; a public failure leaves them disagreeing until Retry.","The source disagrees with itself about which one the prod payer reads: nostr.rs:30-34 says the public relays, nostr.rs:667 says the instance. Which is true?"]},{"id":"BS","code":"BS","name":"Brainstorm (brainstorm.world)","short":"BRAINSTORM","group":"inst","gx":21.5,"gy":7.5,"w":2,"d":2,"h":30,"kind":"slab","one":"The service that owns trust: the setup API at api.brainstorm.world, the scores relay at wss://scores.brainstorm.world, and the profile pages the Account screen links to.","what":"GET https://api.brainstorm.world/setup/{hex} answers a JSON array of [type, key, relay] triples — the account's current Brainstorm keys, one per score type. wss://scores.brainstorm.world holds kind-30382 Trusted Assertions, addressable by the subject pubkey in the d tag. The app reads both; it never writes to either.","how":"<code>fetch_brainstorm_key</code> (<code>nostr.rs:1405-1435</code>) builds its own reqwest client (USER_AGENT, 10 s); <code>trust::parse_setup</code> takes the <code>30382:rank</code> triple as the rank provider: Assigned { key, relay }. HTTP 404 means the account has never set up at Brainstorm → NoAccount; any other non-2xx or an unparseable body is Err, so a broken endpoint reads as \"couldn't check\", never as \"no account\". Kind-30382 reads go to whichever relay the winning Treasure Map row names for its provider, queried with <code>Filter kind 30382 .identifier(subject)</code>; the fetched event must be authored by the provider and carry a rank, and the signature is verified.","steps":[["Setup","GET api.brainstorm.world/setup/{hex}: the [type, key, relay] triple whose type is 30382:rank is the provider; 404 is NoAccount."],["Assertion","kind 30382 on the provider relay, #d = subject, authored by the provider."]],"cond":[]},{"id":"KS","code":"KS","name":"Key store","short":"KEY STORE","group":"keys","gx":0.5,"gy":10.5,"w":2,"d":2,"h":26,"kind":"store","one":"The macOS keychain, service magic-carpet-chat: two nsecs and the Coinos login. Env vars win; debug builds use plain files.","what":"Entries issuer-nsec, claimant-nsec, issuer-coinos-login, claimant-coinos-login. Reads check MC_ISSUER_NSEC and MC_CLAIMANT_NSEC first. Secrets leave the module as nostr Keys, whose Debug prints only the public key, or inside Secret, which prints redacted. The --import-keys flag copies env keys into the keychain and prints only npubs.","how":"<code>load_nsec</code> (<code>secrets.rs:260-278</code>): env trimmed and non-empty, else <code>keyring::Entry(SERVICE, entry)</code>. <code>parse_secret</code> rejects an npub with \"that's your public key\" and anything not nsec1 or 64 hex; error text never echoes the input. <code>DEV_STORE = cfg!(debug_assertions)</code> swaps the keychain for 0600 files under ~/Library/Application Support/magic-carpet-chat/dev-secrets/, because every unsigned debug binary is a new app to macOS (<code>secrets.rs:139-160</code>). <code>forget_nsec</code> deletes the entry only. <code>store_available</code> is fatal for --import-keys and a stderr warning at launch. With a valid env override set, a paste is still written but stays inert: the env key is announced and signs.","steps":[["Resolve","Env first, else the keychain entry."],["Validate","npub: PublicKeyPasted; not a key: NotAKey; else Keys::parse."],["Store","Trimmed text under the entry; a 0600 file in debug builds."],["Forget","Delete the entry; the env override is untouched."],["CLI","--import-keys: store both env keys, print issuer: npub… and claimant: npub…."]],"cond":["An invalid MC_*_NSEC poisons the account: every publish fails with the env error even after a good paste, and onboarding can open with it still in force (nostr.rs:500, 784-791, 861-864). Validate at launch?","InvalidKey always names the env var, even when the bad value came from the keychain (secrets.rs:277).","A key imported with a debug build is invisible to the release .app, and the reverse."]},{"id":"CO","code":"CO","name":"Coinos wallet flow","short":"COINOS FLOW","group":"keys","gx":3.5,"gy":10.5,"w":2,"d":2,"h":36,"kind":"job","one":"One click opens a hosted Coinos account bound to the claimant key: keychain first, then register, then the address into the profile.","what":"The app invents a username (carpet plus 8 random characters) and a 32-character password, writes them to the keychain before any network call, and registers. Coinos serves a Lightning address at once. The app then merges it into the key's profile and publishes. A retry reuses the saved login and asks Coinos whether the wallet exists before registering again.","how":"<code>create_coinos_wallet</code> (<code>nostr.rs:701-773</code>): session, stored login, <code>Login::reuse_or_fresh</code> (a login for another pubkey is replaced), <code>store_coinos_login</code>, probe <code>GET /.well-known/lnurlp/user</code> only on reuse, <code>POST https://coinos.io/api/register {user:{username,password,pubkey}}</code> with a 30 s timeout. The reply token is shape-checked and dropped, so the app never shows a balance. Only <code>CoinosError::Refused</code> (any non-2xx) deletes the login; transport errors and a 2xx without a token keep it. Then <code>publish_lud16</code>, and <code>WalletCreated { username, lightning_address, publish_error }</code> always, <code>ProfileLoaded</code> on success. Claimant only: <code>has_local_wallet</code> is false for the issuer.","steps":[["Session","Keys and Api for the claimant; no key is WalletFailed."],["Saved login","Reuse if the pubkey matches; unreadable JSON stops with the entry name."],["Store first","Write the fresh login before any HTTP."],["Probe on retry","lnurlp: 404 register again, payRequest skip, anything else stops with WalletFailed."],["Register","POST /api/register; a refusal deletes the login."],["Publish","Merge lud16 into the kind-0, instance then public relays."],["Report","WalletCreated, then ProfileLoaded."]],"cond":["Any non-2xx from /api/register counts as Refused and deletes the login; a proxy 502 after Coinos created the account strands a real password (coinos.rs:169-172).",{"q":"A login stored for a different pubkey is silently overwritten and the old wallet's password is lost.","to":"the in-flight refactor, which binds the login to the account record"},"Forget this key leaves the Coinos login in place. Intended, so a re-import finds its wallet?"]},{"id":"CX","code":"CX","name":"Coinos (coinos.io)","short":"COINOS","group":"keys","gx":6.5,"gy":10.5,"w":2.5,"d":2,"h":30,"kind":"slab","one":"The hosted Lightning wallet. Two endpoints are ever called: register, and the lnurlp probe. No login, no balance, no sends.","what":"Coinos holds the sats, so balances should stay small. Funding works because the lnurlp endpoint is live the moment the account exists; the QR on the Wallet screen points at it. The password is in the keychain; the app never calls /login, which runs a captcha.","how":"<code>coinos.rs</code>: BASE https://coinos.io, one static reqwest client, 30 s timeout, on the runtime thread. <code>create_wallet</code> POSTs /api/register: a non-2xx is Refused, a 2xx without a token is an Http error. <code>wallet_exists</code> GETs /.well-known/lnurlp/user: 404 means no account, tag payRequest means it exists, anything else is an error. <code>lnurl_pay</code> bech32-encodes the lnurlp URL with the original checksum, uppercase, per LUD-01. Usernames drop l, o, 0 and 1; Coinos lowercases them itself.","steps":[["Register","POST /api/register {user:{…}}: 2xx with token; non-2xx is Refused; 2xx without a token is Http."],["Probe","GET /.well-known/lnurlp/user on retry."],["Pay endpoint","What every Lightning wallet hits when it scans the QR."]],"cond":["The register body shape and the 2-24 lowercase rule are asserted from coinos-server source with no live contract test."]},{"id":"AN","code":"AN","name":"Anthropic Messages API","short":"ANTHROPIC","group":"chat","gx":4.5,"gy":14,"w":2.5,"d":2,"h":30,"kind":"slab","one":"POST https://api.anthropic.com/v1/messages with stream:true, answered as Server-Sent Events. Both chat paths call it the same way.","what":"Model claude-sonnet-5, max_tokens 64000, header anthropic-version 2023-06-01, key in x-api-key. The body is the transcript as alternating user and assistant messages and nothing else: no system prompt, no tools, no temperature.","how":"Desktop: <code>chat.rs:300-307</code> builds the request on gpui's HttpClient, reads only lines prefixed <code>data: </code>, and acts on content_block_delta, message_delta with stop_reason max_tokens, and error; message_stop is ignored and the stream ends when the connection closes. Worker: <code>worker/src/index.ts:159-176</code> does the same with <code>fetch</code> and copies the bytes through byte for byte. The constants are duplicated, not shared.","steps":[["Request","POST with model, max_tokens, stream, messages."],["Events","message_start, content_block_delta, message_delta, message_stop, ping, error."],["Errors","Every error body is cut at 300 chars; 401 and 429 get their own wording."]],"cond":[]},{"id":"CC","code":"CC","name":"Chat cell (worker)","short":"CHAT CELL","group":"chat","gx":8,"gy":15.5,"w":2.5,"d":2.5,"h":56,"kind":"tall","one":"One Durable Object per conversation id on celld, a self-hosted Workers runtime on the nashauto-git box: one turn at a time, Anthropic upstream, the reply streamed back and written to SQLite as it arrives.","what":"A tailnet client POSTs /chat/:id with a message and gets Anthropic's own SSE back; GET /chat/:id returns the transcript. A second POST while a reply streams gets 409. A reply that never finished stays on disk flagged incomplete. There is no authentication: the tailnet is the perimeter. The desktop app does not call it.","how":"<code>worker/src/index.ts</code>: table <code>messages(id, role, content, created_at, complete)</code>, migrated in the constructor. Lock: <code>inFlight</code>, <code>progressAt</code>, a <code>turn</code> counter; 409 only if in flight and progressed within STALE_TURN_MS (30 s), because a client hangup kills the relay mid-await and no finally runs. Orphan user row deleted, user row inserted, upstream POST, <code>relay()</code> copies bytes and saves on the first delta then every 16 deltas or 250 ms; complete=1 only after message_stop; no text at all rolls the user row back. Deploy: <code>deploy.sh</code> substitutes the key into a temp config and writes to the chat prefix of an S3 bucket that also holds dgit, the private git forge; a deploy to the bucket root would break every hosted repository. The box runs <code>celld-chat.service</code> on 127.0.0.1:8081 behind Tailscale port 10000. Never rename the script: Durable Object data is bound to it.","steps":[["Route","/chat/:id, 1-128 safe chars; idFromName picks the cell."],["Lock","409 if a fresh turn is in flight; else take the cell."],["Insert","Drop a trailing orphan user row, insert this one."],["Upstream","POST the whole history; a thrown fetch is 502, an upstream HTTP error passes through; both delete the row."],["Relay","Copy bytes to the client; save fragments with complete=0."],["Finish","complete=1 on message_stop; the current turn releases the cell."],["Deploy","celld deploy to the chat prefix, then restart celld-chat on the box, never celld.service."]],"cond":["complete=0 fragments are fed back to the model as full assistant turns on the next POST (index.ts:174-175).","Any tailnet member can read or append to any conversation by guessing its id.","Is celld-chat running on the box today? The repo holds no deploy record.","The key sits in cleartext in the bundle metadata in S3; who else can read that bucket?"]},{"id":"PK","code":"PK","name":"Plumbing and packaging","short":"PLUMBING","group":"sup","gx":18,"gy":11,"w":2.5,"d":2,"h":24,"kind":"box","one":"gpui-kit 0.6.0, the palette from the design mock, eleven copied SVG icons, UTC time formatting, and an unsigned .app bundle.","what":"The whole UI is one crates.io dependency plus the HTTP client it does not re-export. Every colour is a hex value copied from the mock; only gpui-component's own controls are repainted through the theme. Times print in UTC. make-app.sh wraps the release binary and writes a READ ME FIRST for Gatekeeper.","how":"<code>Cargo.toml</code>: gpui-kit 0.6.0, gpui-pre-reqwest-client 0.3.4, nostr-sdk 0.45, tokio, reqwest with rustls, keyring 4, lightning-invoice, bech32, qrcode without default features, sha2, unicode-normalization. <code>palette::apply</code> overwrites fifteen theme colours and two radii after <code>Theme::change(Dark)</code>. <code>icons::Assets</code> serves <code>icons/mc/name.svg</code> from an include_bytes table and falls through to gpui-kit's lucide set. <code>timefmt</code>: HH:MM:SS UTC, relative ages, thousands-grouped sats. <code>scripts/make-app.sh</code>: bundle id world.MagicCarpet.magic-carpet-chat, macOS 12 minimum, unsigned; both dist/ and dist-live/ hold a bundle. Thirty-nine unit tests across seven modules; the worker has only tsc.","steps":[["Init order","gpui_kit::init, Theme Dark, palette::apply, bind_keys, http client."],["Icons","Screen::icon names map to icons/mc/*.svg; the colour is passed in."],["Bundle","install the binary and icon.icns, write Info.plist and PkgInfo, write READ ME FIRST.txt."],["Ship","ditto zip plus the txt at the zip root."]],"cond":["make-app.sh says the bundle id must match src/config.rs and a directories crate; neither exists. Which should the id track?","README.md still describes a 400-line chat toy with MODEL in main.rs; DEMO.md omits the ~/.config/anthropic/key fallback. Rewrite both?","aws-lc-rs compiles in although ring is the provider; reqwest's rustls-tls feature pulls it too, so a gpui-kit feature alone cannot drop it."]},{"id":"UB","code":"UB","name":"Unbuilt screens","short":"NOT BUILT","group":"off","ghost":true,"gx":21.5,"gy":8,"w":2,"d":2,"h":40,"kind":"screen","one":"Payments, Claimants, Leaderboards, Tags and Settings render \"This screen is not built yet.\" The search field looks live and is not; so do four of the Account page's five tabs.","what":"Five of the twelve Screen variants are placeholders. cmd-3, 4, 5 and 7 reach four of them; Settings is a rail button with no shortcut. Accounts is built (AC), and on the Account page only the Trust tab has real data — Identity & keys, Progress, Wallet and Limits & defaults say \"Not built yet.\" The placeholders exist so the nav matches the design mock.","how":"<code>Screen</code> (<code>shell.rs:36-49</code>); <code>placeholder()</code> at <code>shell.rs:1944-1962</code>; the search InputState at <code>shell.rs:456-458, 1904</code>; the four tab stubs in <code>account.rs</code>.","steps":[["Navigate","cmd-3 Payments, cmd-4 Claimants, cmd-5 Leaderboards, cmd-7 Tags; rail button for Settings."],["Render","Label plus the not-built line."]],"cond":[{"q":"Do Accounts and Settings stay placeholders for the demo, or does the refactor's account setup take the Accounts slot?","r":"Accounts is built now: account cards plus the per-account page with the Trust tab (src/account.rs, this working tree). Settings is still a placeholder."}]},{"id":"NA","code":"NA","name":"N-account store (in flight)","short":"MOVING","group":"off","ghost":true,"gx":21.5,"gy":11.5,"w":2,"d":2,"h":26,"kind":"store","one":"Uncommitted work in the working tree, written by another session on 2026-09-10: accounts.json replaces the keychain and N accounts replace the two slots.","what":"Direction of travel, read at 22:20 local: one accounts.json under Application Support (mode 0600, atomic rename, MC_STORE_DIR override) holds every nsec and Coinos login; accounts are keyed by pubkey with an active flag; an Account setup screen with create, paste and browse paths replaces Onboarding and is also reachable from a plus in the rail; creating an account always opens a Coinos wallet; the Coinos token is kept and GET /api/me shows a balance on a 3 s poll; MC_NSECS imports a comma-separated list at every launch; the issuer for reads is MC_ISSUER_NPUB or the house key, never a stored key.","how":"Working tree only: <code>src/account_setup.rs</code>, <code>src/secrets.rs</code> with <code>Store { active, accounts }</code>, <code>Command::AddAccount / RemoveAccount / SetActive / FetchBalance</code>, <code>Update::AccountsLoaded / AccountAdded / AddAccountFailed / Balance</code>, <code>ErrorSource::Wallet</code>, <code>merge_lud16(existing, lud16, name)</code>, keyring removed from Cargo.toml, shell.rs rewritten to match. Every structure in this atlas keyed on Issuer/Claimant, the keychain entries, and the env override rule changes when it lands.","steps":[["Store","accounts.json, 0600, written to .tmp then renamed under a lock."],["Add","Dedupe by pubkey, make active, open a wallet in the same step."],["Remove","Drop nsec and Coinos login together; fall back to the first remaining account."],["Balance","GET https://coinos.io/api/me with the kept token, every 3 s while the panel shows."]],"cond":[{"q":"Which revision should the atlas track once the refactor lands: HEAD, the refactor, or both with a moving marker?","to":"rebuild after the refactor commit"}]}];
