const CH = [{"id":"window","title":"One window, one Shell","reveal":["SH","DB","NR"],"lede":"The app is one 1180x800 window; one view called the Shell owns every piece of key, account and bounty state and paints whatever screen is up.","story":"<p>Shortcuts drive everything: cmd-1 to cmd-8 pick a screen even from inside a text field, cmd-[ and cmd-] switch account, cmd-N opens a form. <mark>Every frame is a function of the Shell struct</mark>; only the Chat pane keeps its own transcript. The Dashboard is the home screen.</p>","flow":[["NR","SH","cmd-1",{"action":"GoDashboard"}],["SH","DB","paint from state",{"attention":"All clear","activity":"newest first"}]]},{"id":"threads","title":"Two threads, one bridge","reveal":["BR","RT"],"lede":"gpui's executor is not tokio, so everything that talks Nostr, the instance or Coinos lives on a second thread and speaks to the window through two channels.","story":"<p>The Shell sends a Command and forgets it; the runtime thread does the work and sends back Updates, each one a deduplicated fact, drained by one gpui task with one repaint per Update. <mark>The window never awaits a tokio future</mark>; a tokio timer polled on the gpui side aborts the process, and that is why this bridge exists. The Chat pane is the one exception: it streams on the window's own executor.</p>","flow":[["SH","BR","Command::FetchBounties",{}],["BR","RT","dispatch",{"spawn":"fetch_bounties"}],["RT","BR","Update::Bounties",{"count":4}],["BR","SH","apply + notify",{}],["SH","DB","paint",{}]]},{"id":"keys","title":"Who you are: keys","reveal":["KS","OB"],"lede":"Two account slots, issuer and claimant, each an nsec in the macOS keychain; a first launch with no key anywhere opens onboarding.","story":"<p>A key pasted in onboarding always becomes the claimant, the person who claims and gets paid; the issuer slot fills from the sidebar paste card or MC_ISSUER_NSEC. <mark>Env vars win over the keychain</mark>: MC_ISSUER_NSEC and MC_CLAIMANT_NSEC skip onboarding and survive \"Forget this key\". Secrets cross threads only inside a wrapper that prints redacted.</p>","flow":[["OB","SH","Enter with an nsec",{"secret":"<redacted>"}],["SH","BR","Command::ImportKey",{"account":"Claimant"}],["BR","RT","dispatch",{}],["RT","KS","store claimant-nsec",{"service":"magic-carpet-chat"}],["RT","BR","AccountLoaded, ImportReady",{"npub":"npub1…","name":"from the kind-0 probe, chapter 4"}],["BR","SH","apply",{}],["SH","OB","ready panel",{"npub":"npub1su7gycf…"}]]},{"id":"instance","title":"Reading the instance","reveal":["IA","IN","RL"],"lede":"Bounties, claims and payment rows all come from the instance's REST API; the relay socket only feeds the rail dot until a bounty is watched.","story":"<p>The runtime builds one HTTP client per account for writes and reads the house issuer's bounties with no key at all. <mark>Nothing is ever published over the relay socket</mark>; the relay is for receipts and the 3 s status poll that turns the dot green.</p>","flow":[["RT","IA","list_bounties",{"issuer":"853baa94…"}],["IA","IN","GET /api/bounties?issuer=&status=all",{}],["IN","IA","bounties",{"count":4}],["IA","RT","parsed",{}],["RT","BR","Update::Bounties",{}],["BR","SH","apply",{}],["SH","DB","paint",{"summary":"watching magic-carpet.brainstorm.world"}],["RL","RT","status: connected",{}],["RT","BR","RelayStatus(true)",{}],["BR","SH","green dot",{}]]},{"id":"publish","title":"The issuer publishes","reveal":["FM","EV","BO"],"lede":"cmd-N as the issuer: seven fields, one Enter, a kind-39998 DList (the replaceable header every bounty points at) through the publish door, POST /api/strfry/publish, then a logged-in POST that creates the auto-pay bounty.","story":"<p>The form is validated before anything leaves, because the DList goes out first and cannot be unpublished, and the bounty half waits in the Shell until the DList's coordinate comes back. <mark>The DList is an HTTPS POST, not a relay send</mark>; the server pipes it into strfry. The bounty needs the kind-22242 cookie login and the server's auto-pay allowlist.</p>","flow":[["NR","SH","cmd-N",{"account":"Issuer"}],["SH","FM","seven fields",{"reward":100,"cap":400,"min_rank":2}],["FM","SH","Enter",{"validated":true}],["SH","BR","Command::PublishDList",{"singular":"US City"}],["BR","RT","dispatch",{}],["RT","EV","kind 39998",{"d":"us-city"}],["RT","IA","publish_event",{}],["IA","IN","POST /api/strfry/publish",{}],["IN","IA","200 success",{}],["RT","BR","DListPublished",{"coordinate":"39998:853baa94…:us-city"}],["BR","SH","apply, send CreateBounty",{}],["SH","BR","Command::CreateBounty",{"autoPay":true}],["BR","RT","dispatch",{}],["RT","IA","login, create",{"kind":22242}],["IA","IN","POST /api/bounties",{}],["IN","IA","bounty",{"id":"<uuid>"}],["RT","BR","BountyCreated",{"id":"<uuid>"}],["BR","SH","apply",{}],["SH","BO","select, Auto-pay armed",{}]]},{"id":"claim","title":"The claimant claims","reveal":["AF"],"lede":"cmd-] to the claimant, cmd-N, one item name, Enter: a signed kind-39999 claim goes through the same door, POST /api/strfry/publish, and the feed says so.","story":"<p>The claim carries the DList coordinate in a z tag and the item name twice. <mark>The publish door is the only way in</mark>: a claim sent to public relays never reaches the bounty machinery. A sticky toast explains that only keys the issuer's web of trust ranks 2 or higher are listed at all; the bounty's own min rank (default 2, a separate gate) decides who gets paid.</p>","flow":[["NR","SH","cmd-] then cmd-N",{"account":"Claimant"}],["SH","FM","claim form",{"bounty":"5f44688e…"}],["FM","SH","Enter",{"name":"Memphis"}],["SH","BR","Command::PublishClaim",{}],["BR","RT","dispatch",{}],["RT","EV","kind 39999",{"d":"memphis-a0576ef1"}],["RT","IA","publish_event",{}],["IA","IN","POST /api/strfry/publish",{}],["IN","IA","200 success",{}],["RT","BR","ClaimPublished",{"event_id":"afb4bfe5…"}],["BR","SH","apply",{}],["SH","AF","Claim afb4bfe5… submitted",{}],["SH","BO","form closes",{}]]},{"id":"money","title":"Watching the money move","reveal":["BW","AP"],"lede":"The app never pays: the server's auto-pay watcher does, and this app's bounty watcher polls the detail and reports each payment fact exactly once.","story":"<p>The bounty watcher in this app polls every 2 s while a payment is pending, else 10 s (30 s on a manual-pay bounty); the card shows the current state plus a retroactive \"Auto-pay attempted\", and each transition lands in the feed with the server's timestamp. <mark>A receipt pushed by the relay is only a reason to poll sooner</mark>; the fact is the server's validated claims[].zapReceipt, because only the server knows the delegate key, the key it zaps from on the issuer's behalf. A key with no Lightning address fails at payment; chapter 8 fixes that.</p>","flow":[["SH","BR","Command::WatchBounty",{"id":"5f44688e…"}],["BR","RT","dispatch",{}],["RT","BW","spawn watch_bounty",{}],["BW","IA","get_bounty, 2 s",{}],["IA","IN","GET /api/bounties/{id}",{}],["IN","IA","snapshot",{"autoPayment":null}],["IA","BW","ingest",{}],["BW","RL","subscribe 9735 #e",{}],["AP","IN","pays: attempting, paid",{"sats":100}],["IN","IA","snapshot",{"autoPayment":"paid"}],["AP","IN","receipt seen: settled",{}],["RL","BW","receipt pushed: poll now",{}],["BW","BR","PaymentState, ReceiptSeen",{"secs_from_claim":27}],["BR","SH","apply",{}],["SH","BO","claim card",{"row":"Zap receipt · 100 sats · 27 s after the claim"}],["SH","AF","feed",{}]]},{"id":"wallet","title":"A wallet for the key","reveal":["WA","CO","CX"],"lede":"A generated key has no Lightning address, so its claims fail at payment; one click opens a Coinos wallet bound to the key.","story":"<p>The app invents a login and <mark>writes it to the keychain before the network call</mark>, so a signup that times out on the way back is never lost. It deletes the login only when Coinos refuses outright. Coinos holds the sats, so keep the balance small; the address still has to reach the profile, which is the next chapter.</p>","flow":[["WA","SH","Create a Coinos wallet",{}],["SH","BR","Command::CreateCoinosWallet",{"account":"Claimant"}],["BR","RT","dispatch",{}],["RT","KS","write login first",{"entry":"claimant-coinos-login"}],["RT","CX","POST /api/register",{"username":"carpetab29cd34"}],["CX","RT","token, dropped; continues in the next chapter",{}]]},{"id":"profile","title":"Telling the payers the address","reveal":["PR"],"lede":"Still inside the wallet command, the new address is merged into the key's existing kind-0 profile, only lud16 changed, and published to the instance and then three public relays.","story":"<p>Strike, Primal and the server's payer read the public relays, so the profile must land there; it goes to the instance first so this app's own probe, which reads only the instance, sees the address at once. <mark>Merge, never rebuild</mark>: a kind-0 made from nothing would wipe the name and picture on every relay that accepts it, and a failed read is an error, not an empty profile.</p>","flow":[["RT","IA","scan kind 0",{"filter":{"kinds":[0]}}],["IA","IN","GET /api/strfry/scan",{}],["IN","IA","existing profile",{"name":"Matthias","about":"…"}],["RT","IA","merged, signed kind 0",{"lud16":"carpetab29cd34@coinos.io"}],["IA","IN","POST /api/strfry/publish",{}],["RT","PR","same event to damus, nos.lol, primal",{"wait":"10 s","need":"one acceptance"}],["RT","BR","WalletCreated, ProfileLoaded",{"lightning_address":"carpetab29cd34@coinos.io"}],["BR","SH","apply",{}],["SH","WA","QR",{"qr":"lightning:LNURL1…"}]]},{"id":"chat","title":"Chat, two ways","reveal":["CP","AN","CC"],"lede":"The cmd-8 pane streams Claude straight from Anthropic with the owner's key; a worker in the repo does the same job on a separate tailnet box, and nothing connects them.","story":"<p>Both send the whole transcript with model claude-sonnet-5, no system prompt, and read the same Server-Sent Events. The desktop keeps the transcript in memory and streams on the window's own executor; the worker ke const HOW_HTML = "<div class=\"eyebrow\">magic-carpet-chat · HEAD 3bf9877</div><h1 class=\"t\">How it's built</h1><div class=\"sub\">two threads, one door, one keychain</div>\n<p>A gpui-kit window on one thread; nostr-sdk and reqwest on a second thread with its own tokio runtime; two unbounded channels between them. The Chat pane alone streams on the window's executor. Every DList, claim and profile update leaves through <code>POST /api/strfry/publish</code>. Keys sit in the macOS keychain under <code>magic-carpet-chat</code>. The app never pays: the server's auto-pay watcher does, and this app polls its rows.</p>\n<h3 class=\"sec\">Filesystem</h3><pre>magic-carpet-chat/\n  src/main.rs         entry: --import-keys, gpui boot, one window\n  src/shell.rs        Shell state, shortcuts, rail, sidebar, forms, apply()\n  src/nostr.rs        runtime thread, Command/Update, relay, watcher, ledger, profile\n  src/api.rs          instance REST client, Bounty/Claim/AutoPaymentRow shapes\n  src/events.rs       kind 39998 / 39999 builders, kind 9735 parser, slug + hash8\n  src/secrets.rs      keychain, Secret, env overrides, --import-keys\n  src/coinos.rs       Coinos signup, LNURL\n  src/wallet.rs       Wallet panel, QR\n  src/onboarding.rs   first-launch screen\n  src/dashboard.rs    Needs attention, Recent activity\n  src/bounties.rs     list, detail, claim timeline, form cards\n  src/chat.rs         Chat pane, Anthropic SSE\n  src/palette.rs src/icons.rs src/timefmt.rs\n  worker/src/index.ts celld ChatCell (server chat, not wired in)\n  scripts/make-app.sh unsigned .app + READ ME FIRST\n  docs/               this atlas</pre>\n<h3 class=\"sec\">Environment</h3><pre>MC_ISSUER_NSEC / MC_CLAIMANT_NSEC   keys, win over the keychain\nMC_ISSUER_NPUB                     whose bounties to list when no issuer key is stored\nMC_RELAY_URL / MC_BASE_URL         rehearsal overrides\nANTHROPIC_API_KEY                  or ~/.config/anthropic/key</pre>";
const DECISIONS_HTML = "<li><b>Executor.</b> Nostr, instance and Coinos work runs on a dedicated tokio thread; the window awaits only two futures channels. gpui's executor is not tokio and a tokio future polled there aborts the process. The Chat pane is the one exception: it polls its SSE body on gpui's executor, which is why only ReqwestClient::user_agent may be used.</li><li><b>TLS.</b> rustls's ring provider is installed before any client exists, because gpui-kit and reqwest pull ring and aws-lc-rs both and rustls refuses to guess.</li><li><b>UI stack.</b> One crates.io dependency, gpui-kit 0.6.0, plus the reqwest client it does not re-export. Cargo refusing two gpui-pre versions is the safety net.</li><li><b>Publish door.</b> DLists and claims leave through POST /api/strfry/publish, never a relay socket; an event sent to public relays never reaches the bounty machinery. The kind-0 profile update goes through the door first and then to three public relays.</li><li><b>Receipt truth.</b> A kind-9735 pushed by the relay only triggers an early poll. A receipt is a fact only when the server returns it in claims[].zapReceipt, because only the server knows the delegate key.</li><li><b>Profile write.</b> The kind-0 is merged field by field and only lud16 changes. A profile rebuilt from nothing would wipe the name and picture on every relay that accepts it.</li><li><b>Key precedence.</b> MC_ISSUER_NSEC / MC_CLAIMANT_NSEC win over the keychain. Forget this key deletes the keychain entry only, so an env key comes straight back.</li><li><b>Coinos order.</b> The Coinos login is written to the keychain before POST /api/register and deleted only on an explicit refusal, so a signup that times out on the way back is never lost.</li><li><b>Watching.</b> One live bounty watcher at a time. Ledgers outlive watchers, so re-selecting a bounty never replays its history into the feed.</li><li><b>Validate first.</b> The bounty form is checked before anything publishes, because the DList goes out first and cannot be unpublished.</li><li><b>Secrets.</b> nsecs, the Coinos password and the Anthropic key cross threads only inside Secret, whose Debug prints . Error text is fixed, never the input.</li><li><b>Chat backend.</b> The desktop chat calls api.anthropic.com directly. The worker exists for clients that should not hold a key and is not called from src/.</li><li><b>Chat cell.</b> One turn per conversation cell, 409 for a second POST. A finally block releases the cell on every ending the runtime can see; a 30 s stale clock covers the one it cannot, a client hangup. No auth: the tailnet is the perimeter.</li><li><b>Packaging.</b> Ship an unsigned .app with a READ ME FIRST for Gatekeeper rather than sign and notarize.</li>";

    <div class="pk"><div class="lbl">Route</div><div class="route">${esc(A.code)} ${esc(A.name)} &nbsp;→&nbsp; ${esc(B.code)} ${esc(B.name)}</div><div class="lbl">Payload (representative)</div><pre>${esc(JSON.stringify(h.payload,null,2))}</pre></div>
    <p>Payload shapes are what the design implies, not measured traffic.</p>
    <div class="actions"><button class="ctl" onclick="stepOnce()">Trace one step</button><button class="ctl" onclick="S.selPacket=null;S.playing=true;syncFlowBtn();renderPanel();drawPackets()">Release & play</button><button class="ctl" onclick="select('${esc(B.id)}')">Open ${esc(B.code)}</button></div>`; return; }
  const id=S.selected??S.hover; const n=id?sceneNodes.find(x=>x.id===id):null;
  if(!n){ renderChapterPanel(); return; }
  if(n.inside){ const parent=byId[S.inside]; const i=+n.id.slice(1);
    body.innerHTML=`<div class="eyebrow">Inside ${esc(parent.code)} · ${esc(parent.name)} · step ${i+1} of ${parent.steps.length}</div><h1 class="t">${esc(n.name)}</h1><p class="lede">${esc(n.desc)}</p>
    <h3 class="sec">All steps</h3>${parent.steps.map((s,j)=>`<div class="step ${j===i?'cur':''}"><div class="no">${j+1}</div><div class="tx"><b>${esc(s[0])}</b> — ${esc(s[1])}</div></div>`).join('')}
    <div class="actions"><button class="ctl" onclick="comeOut()">← Come back out</button></div>`; return; }
  const status = n.ghost?'<span class="chip ghost static">Not switched on</span>':`<span class="chip static">${((GROUPS.find(g=>g.id===n.group)||{}).title||'supporting').toLowerCase()}</span>`;
  const pinned=S.selected===n.id;
  let content='';
  if(S.tab==='what') content=`<p class="lede">${n.one}</p><details${pinned?' open':''}><summary>Read more</summary><p>${n.what}</p></details>${n.steps?`<details><summary>Steps in execution</summary>${n.steps.map((s,j)=>`<div class="step"><div class="no">${j+1}</div><div class="tx"><b>${esc(s[0])}</b> — ${esc(s[1])}</div></div>`).join('')}</details>`:''}`;
  else if(S.tab==='how') content=`<p class="lede">${n.one}</p><p>${n.how}</p>`;
  else content=`<p class="lede">${n.one}</p>`+(n.cond&&n.cond.length?qHtml(n.cond):`<p>Nothing open here right now.</p>`);
  body.innerHTML=`<div class="eyebrow">${esc(n.code)} · ${pinned?'pinned':'hovering'}${isNew(n.id)?' · new in this chapter':''}</div><h1 class="t">${esc(n.name)}</h1><div class="sub">${status}</div>${content}
  ${pinned?`<div class="actions">${n.steps?`<button class="ctl" onclick="goInside('${n.id}')">→ Go inside</button>`:''}<button class="ctl" onclick="select(null)">Back to chapter</button></div>`:''}`;
}
function renderChapterPanel(){
  const c=CH[S.ch]; const last=S.ch===CH.length-1;
  if(S.tab==='how'){ body.innerHTML=HOW_HTML; return; }
  if(S.tab==='cond'){ body.innerHTML=`<div class="eyebrow">${esc(TITLE)}</div><h1 class="t">Open questions</h1><div class="sub">${last?'everything unresolved, by structure':'for the structures revealed so far'}</div>`+NODES.filter(n=>revealedIds().includes(n.id)&&n.cond&&n.cond.length).map(n=>`<h3 class="sec">${n.code} · ${esc(n.name)}${n.ghost?' <span class="chip ghost static">later</span>':''}</h3>${qHtml(n.cond)}`).join(''); return; }
  const chips = last ? '' : `<h3 class="sec">New in this chapter</h3><div>${c.reveal.map(nodeChip).join('')}</div>`;
  const nav=`<div class="actions"><button class="ctl" onclick="prevCh()" ${S.ch===0?'disabled':''}>◂ Back</button><button class="ctl primary" onclick="nextCh()" ${last?'disabled':''}>${S.ch===CH.length-2?'Show the whole system ▸':'Next ▸'}</button></div>`;
  body.innerHTML=`<div class="eyebrow">Chapter ${S.ch+1} of ${CH.length}</div><h1 class="t">${esc(c.title)}</h1><p class="lede">${c.lede}</p>${c.story}${chips}${nav}
  ${last?`<h3 class="sec">Decisions locked</h3><ul>${DECISIONS_HTML}</ul>`:''}`;
}
document.querySelectorAll('#tabs button').forEach(b=>b.addEventListener('click',()=>{S.tab=b.dataset.tab;S.selPacket=null;renderPanel();drawPackets();}));

/* ---------------- STATS ---------------- */
function renderStats(){ const el=document.getElementById('stats'); const open=NODES.reduce((a,n)=>a+qOpen(n),0), routed=NODES.reduce((a,n)=>a+(n.cond||[]).filter(c=>c.to).length,0), res=NODES.reduce((a,n)=>a+(n.cond||[]).filter(c=>c.r).length,0);
  const dyn={chapter:`${S.ch+1} / ${CH.length}`, shown:`${revealedIds().length} / ${NODES.length}`, questions:`${open} open · ${routed} routed · ${res} resolved`};
  const all=[...(STATS||[]), {k:'Chapter',v:dyn.chapter},{k:'Structures shown',v:dyn.shown},{k:'Open questions',v:dyn.questions,grow:true}];
  el.innerHTML=all.map(s=>`<div class="stat${s.grow?' grow':''}"><div class="k">${s.k}</div><div class="v">${s.v}</div></div>`).join(''); }

/* ---------------- INDEX + RAIL ---------------- */
function renderIndex(){
  const ix=document.getElementById('index'); ix.innerHTML=''; const rev=new Set(revealedIds());
  GROUPS.forEach(g=>{ const h=document.createElement('h4'); h.textContent=g.title; ix.appendChild(h);
    NODES.filter(n=>n.group===g.id).forEach(n=>{ const b=document.createElement('button'); const shown=rev.has(n.id);
      b.className='ix'+(n.ghost&&shown?' ghost':'')+(!shown?' later':'')+(S.selected===n.id?' on':'')+(isNew(n.id)?' new':''); b.dataset.id=n.id;
      b.innerHTML=`<span class="code">${n.code}</span><span class="nm">${esc(n.name)}</span><span class="n" title="${shown?'open questions':'revealed in chapter'}">${shown?qOpen(n):'ch '+(revealChapterOf(n.id)+1)}</span>`;
      b.addEventListener('click',()=>{ if(!shown){ gotoCh(revealChapterOf(n.id)); select(n.id); return; } if(S.view!=='world')comeOut(); select(n.id); focusNode(n); });
      b.addEventListener('mouseenter',()=>{ if(S.view==='world'&&shown){S.hover=n.id;renderPanel();render();} });
      b.addEventListener('mouseleave',()=>{ if(S.view==='world'){S.hover=null;renderPanel();render();} });
      ix.appendChild(b); }); });
  renderStats();
}
function renderRail(){ const r=document.getElementById('rail'); if(S.view!=='world'){ r.innerHTML=`<span class="title">THE SYSTEM &nbsp;›&nbsp; <b>${esc(byId[S.inside].code)} ${esc(byId[S.inside].name)}</b> &nbsp;·&nbsp; steps in execution</span>`; document.getElementById('flowSel').style.display='none'; return; }
  r.innerHTML=CH.map((c,i)=>`<button class="ch ${i===S.ch?'on':i<S.ch?'done':''} ${i>S.maxCh+1?'locked':''}" title="${esc(c.title)}" onclick="gotoCh(${i})">${i+1}</button>`).join('')+`<span class="title">chapter ${S.ch+1} · <b>${esc(CH[S.ch].title)}</b></span>`;
  const fs=document.getElementById('flowSel'); fs.style.display = S.ch===CH.length-1?'flex':'none';
  if(!fs.dataset.built){ fs.innerHTML=[...FLOWS.map(f=>`<button data-f="${f.id}">${f.name}</button>`),'<button data-f="both">All flows</button>'].join(''); fs.dataset.built='1'; fs.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{S.flowSel=b.dataset.f;buildWorldScene();initPackets();render();})); }
  fs.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.f===S.flowSel));
  document.getElementById('btnBack').disabled=S.ch===0; document.getElementById('btnNext').disabled=S.ch===CH.length-1;
}

/* ---------------- NAV ---------------- */
function select(id){ S.selected=id; S.selPacket=null; renderIndex(); renderPanel(); render(); }
function gotoCh(i){ i=Math.max(0,Math.min(CH.length-1,i)); if(S.view!=='world'){S.view='world';S.inside=null;} S.ch=i; S.maxCh=Math.max(S.maxCh,i); S.selected=null; S.hover=null; S.tab='what'; buildWorldScene(); initPackets(); S.playing=true; syncFlowBtn(); renderIndex(); render(); renderPanel(); fitView(true); }
function nextCh(){ gotoCh(S.ch+1); } function prevCh(){ gotoCh(S.ch-1); }
function goInside(id){ const n=byId[id]; if(!n||!n.steps)return; S.view='inside'; S.inside=id; S.selected='s0'; buildInsideScene(n); initPackets(); fitView(true); renderIndex(); render(); renderPanel(); }
function comeOut(){ const was=S.inside; S.view='world'; S.inside=null; buildWorldScene(); initPackets(); S.selected=was; fitView(true); renderIndex(); render(); renderPanel(); }
function orderList(){ return S.view==='world'?sceneNodes.map(n=>n.id):sceneNodes.map(n=>n.id); }
document.addEventListener('keydown',e=>{ if(e.target.tagName==='INPUT')return; const L=orderList(); let i=L.indexOf(S.selected);
  if(e.key==='ArrowDown'){e.preventDefault();select(L[Math.min(L.length-1,i+1)]);}
  else if(e.key==='ArrowUp'){e.preventDefault();select(L[Math.max(0,i-1)]);}
  else if(e.key==='ArrowRight'){e.preventDefault(); if(S.view==='world'&&S.selected)goInside(S.selected);}
  else if(e.key==='ArrowLeft'){e.preventDefault(); if(S.view==='inside')comeOut(); else select(null);}
  else if(e.key==='Enter'||e.key===']'){e.preventDefault(); if(S.view==='world')nextCh();}
  else if(e.key==='['){e.preventDefault(); if(S.view==='world')prevCh();}
  else if(e.key===' '){e.preventDefault();toggleFlow();}
  else if(e.key==='Escape'){select(null);} });

/* ---------------- VIEW / PAN / ZOOM ---------------- */
let tween=null;
function applyView(){ world.setAttribute('transform',`translate(${S.tx},${S.ty}) scale(${S.k})`); }
function tweenTick(){ if(!tween)return; const now=performance.now(); let u=Math.min(1,(now-tween.t0)/tween.dur); u=1-Math.pow(1-u,3); S.tx=tween.a.tx+(tween.b.tx-tween.a.tx)*u; S.ty=tween.a.ty+(tween.b.ty-tween.a.ty)*u; S.k=tween.a.k+(tween.b.k-tween.a.k)*u; applyView(); if(u>=1)tween=null; }
function setView(tx,ty,k,anim){ tween=null; if(anim&&!matchMedia('(prefers-reduced-motion: reduce)').matches){ tween={a:{tx:S.tx,ty:S.ty,k:S.k},b:{tx,ty,k},t0:performance.now(),dur:520}; } else { S.tx=tx;S.ty=ty;S.k=k;applyView(); } }
function bbox(){ let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; sceneNodes.forEach(n=>{[P(n.gx,n.gy,n.h),P(n.gx+n.w,n.gy,n.h),P(n.gx+n.w,n.gy+n.d,-24),P(n.gx,n.gy+n.d,0),P(n.gx,n.gy,0)].forEach(p=>{x0=Math.min(x0,p[0]);y0=Math.min(y0,p[1]);x1=Math.max(x1,p[0]);y1=Math.max(y1,p[1]);});}); return {x0,y0,x1,y1}; }
function fitView(anim){ const r=svg.getBoundingClientRect(); if(!sceneNodes.length)return; const b=bbox(); const pad=40; const k=Math.min((r.width-pad*2)/Math.max(1,b.x1-b.x0),(r.height-pad*2)/Math.max(1,b.y1-b.y0)); if(r.width<80||r.height<80||!isFinite(k)||k<=0)return; const kk=Math.max(.2,Math.min(k,1.5)); setView(r.width/2-((b.x0+b.x1)/2)*kk, r.height/2-((b.y0+b.y1)/2)*kk+8, kk, anim); }
function focusNode(n){ const r=svg.getBoundingClientRect(); const c=P(n.gx+n.w/2,n.gy+n.d/2,n.h/2); setView(r.width/2-c[0]*S.k, r.height/2-c[1]*S.k, S.k, true); }
function zoomAt(f,cx,cy){ tween=null; const nk=Math.max(.35,Math.min(3,S.k*f)); S.tx=cx-(cx-S.tx)*(nk/S.k); S.ty=cy-(cy-S.ty)*(nk/S.k); S.k=nk; applyView(); }
svg.addEventListener('wheel',e=>{e.preventDefault(); const r=svg.getBoundingClientRect(); zoomAt(e.deltaY<0?1.1:0.9,e.clientX-r.left,e.clientY-r.top);},{passive:false});
let drag=null; svg.addEventListener('pointerdown',e=>{ if(e.button!==0)return; tween=null; drag={x:e.clientX,y:e.clientY,tx:S.tx,ty:S.ty,moved:false}; svg.setPointerCapture(e.pointerId); });
svg.addEventListener('pointermove',e=>{ if(!drag)return; const dx=e.clientX-drag.x,dy=e.clientY-drag.y; if(Math.hypot(dx,dy)>3){drag.moved=true;svg.classList.add('dragging');} S.tx=drag.tx+dx; S.ty=drag.ty+dy; applyView(); });
svg.addEventListener('pointerup',e=>{ if(drag&&!drag.moved){ select(null); } drag=null; svg.classList.remove('dragging'); });
document.getElementById('zin').onclick=()=>{const r=svg.getBoundingClientRect();zoomAt(1.2,r.width/2,r.height/2);};
document.getElementById('zout').onclick=()=>{const r=svg.getBoundingClientRect();zoomAt(1/1.2,r.width/2,r.height/2);};
window.addEventListener('resize',()=>fitView(false));

/* ---------------- TIP ---------------- */
function showTip(e,n){ tip.style.display='block'; tip.textContent=n.inside?n.desc:(n.ghost?'Later · ':'')+n.name+' — '+(n.one||'').replace(/<[^>]+>/g,''); moveTip(e); }
function moveTip(e){ const r=svg.getBoundingClientRect(); let x=e.clientX-r.left+14,y=e.clientY-r.top+14; if(x+290>r.width)x-=300; if(y+60>r.height)y-=70; tip.style.left=x+'px'; tip.style.top=y+'px'; }
function hideTip(){ tip.style.display='none'; }

/* ---------------- CONTROLS ---------------- */
function toggleFlow(){ S.playing=!S.playing; if(S.playing)S.selPacket=null; syncFlowBtn(); renderPanel(); drawPackets(); }
document.getElementById('btnFlow').onclick=toggleFlow;
document.getElementById('btnStep').onclick=stepOnce;
document.getElementById('btnReset').onclick=()=>{ select(null); fitView(true); };
document.getElementById('btnNext').onclick=nextCh; document.getElementById('btnBack').onclick=prevCh;

/* ---------------- BOOT ---------------- */
/* Deep links: #ch=3 (1-based chapter) · #sel=SH (pin a structure) · #in=RT (inside view) · #theme=light|dark */
(function(){ const h=new URLSearchParams(location.hash.replace(/^#/,'')); const th=h.get('theme'); if(th)document.documentElement.dataset.theme=th;
  const ch=parseInt(h.get('ch')||'1',10); gotoCh(isNaN(ch)?0:ch-1);
  const sel=h.get('sel'); if(sel&&byId[sel])select(sel);
  const inn=h.get('in'); if(inn&&byId[inn])goInside(inn); })();
</script>
